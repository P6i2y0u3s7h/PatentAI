version: '3.8'

services:
  backend:
    build:
      context: ./patent-search/backend
      dockerfile: Dockerfile
    container_name: patentai-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=PatentAI
      - APP_VERSION=1.0.0
      - HOST=0.0.0.0
      - PORT=8000
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - SUMMARIZATION_MODEL=facebook/bart-large-cnn
    volumes:
      - ./patent-search/backend/data:/app/data
      - ./patent-search/backend/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./patent-search/frontend
      dockerfile: Dockerfile
    container_name: patentai-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
